<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#311b92;#1e1b4b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0f172a;#090d16" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Dynamic Pulsing Glowing Spheres -->
  <circle cx="150" cy="150" r="80" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="70;95;70" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="150" r="100" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="90;115;90" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Central Content -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(0, -65)">
      <path d="M-30,-15 L0,-30 L30,-15 L30,15 L0,30 L-30,15 Z" fill="none" stroke="url(#textGrad)" stroke-width="4" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      </path>
      <circle cx="0" cy="0" r="8" fill="#38bdf8" />
    </g>

    <!-- Title -->
    <text y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" letter-spacing="1">
      Awesome Preview Environment Platform
    </text>

    <!-- Subtitle -->
    <text y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      🚀 Ephemeral Environments • PR Previews • On-Demand Staging • K8s Dev Tooling
    </text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="292" width="1200" height="8" fill="url(#textGrad)" />
</svg>
